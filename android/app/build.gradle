plugins { id 'com.android.application' }

android {
    namespace 'com.plantroof.canopy'
    compileSdk 35
    defaultConfig {
        applicationId 'com.plantroof.canopy'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }
    sourceSets { main { assets.srcDirs = ['../../web'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
